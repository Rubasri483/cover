<!DOCTYPE html>
<html>
<head>
  <title>Book Cover</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle, #dcdcdc 0%, #1a1a1a 100%);
      color: white;
    }

    img {
      margin: 75px;
      border: 10px solid black;
    }

    .book {
      position: relative;
      text-align: center;
    }

    .book-text1 {
      position: relative;
      bottom: 690px;
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
      font-weight: bold;
      font-size: x-large;
      color: rgb(10, 70, 49);
    }

    .book-text2 {
      position: relative;
      bottom: 600px;
      color: black;
      font-family: 'Courier New', Courier, monospace;
      font-style: italic;
    }

    .book-text3 {
      position: relative;
      bottom: 300px;
      color: grey;
      font-family: monospace;
      font-weight: bold;
      font-size: small;
      right: 34px;
    }

    .mypic {
      position: relative;
      bottom: 500px;
      left: 680px;
      width: 90px;
      height: 90px;
      background-size: contain;
    }
  </style>
</head>
<body>
  <center>
    <div class="book">
      <img src="book cover 1.jpg" alt="book" height="650px" width="400px">
      <div class="book-text2">
        <h2><br>The adventurous<br> trip<br> of straw hat pirates<br>by Echiro oda</h2>
      </div>
      <div class="book-text3">
        <h3><small> created by R.Rubasri 212224240139</small></h3>
      </div>
      <hr>
      <div class="mypic">
        <img src="photo 1.jpg" height="100" width="100" />
      </div>
    </div>
  </center>
</body>
</html>
